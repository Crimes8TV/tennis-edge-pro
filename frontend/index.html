<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Primary Meta -->
    <title>Courtside IQ</title>
    <meta name="description" content="Smart Tennis Analytics — Live Scores, KI Predictions, Value Picks" />
    <meta name="application-name" content="Courtside IQ" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme -->
    <meta name="theme-color" content="#020817" />
    <meta name="msapplication-TileColor" content="#020817" />
    <meta name="msapplication-TileImage" content="/icons/icon-144.png" />

    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Courtside IQ" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon" sizes="72x72" href="/icons/icon-72.png" />
    <link rel="apple-touch-icon" sizes="96x96" href="/icons/icon-96.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/icons/icon-128.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <!-- iOS Splash Screens (optional — add if needed) -->
    <!-- <link rel="apple-touch-startup-image" href="/splash/splash-1170x2532.png" media="..."> -->

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72.png" />
    <link rel="shortcut icon" href="/icons/icon-192.png" />

    <!-- Open Graph (für Link-Vorschau) -->
    <meta property="og:title" content="Courtside IQ" />
    <meta property="og:description" content="Smart Tennis Analytics — Live Scores, KI Predictions, Value Picks" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- Prevent flash of unstyled content -->
    <style>
      body { margin: 0; background: #020817; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
            .then(reg => {
              console.log('[PWA] Service Worker registered:', reg.scope);
              // Check for updates every 60s
              setInterval(() => reg.update(), 60000);
            })
            .catch(err => console.warn('[PWA] Service Worker registration failed:', err));
        });
      }

      // PWA Install Prompt — save for later use
      window.pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.pwaInstallPrompt = e;
        // Dispatch event so React can show install button
        window.dispatchEvent(new CustomEvent('pwa-installable'));
      });

      window.addEventListener('appinstalled', () => {
        console.log('[PWA] App installed!');
        window.pwaInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
  </body>
</html>
